services:
  postgres:
    image: postgres:16-alpine
    container_name: sa-learnership-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sa_learnership}
      POSTGRES_USER: ${DB_USERNAME:-sa_learnership_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - sa_learnership_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sa_learnership_user} -d ${DB_NAME:-sa_learnership}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: sa-learnership-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-sa_learnership}
      DB_USERNAME: ${DB_USERNAME:-sa_learnership_user}
      DB_PASSWORD: ${DB_PASSWORD:-DB_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-in-real-envs-min-32-chars}
      UPLOAD_DIR: /app/uploads
    volumes:
      - sa_learnership_uploads:/app/uploads
    ports:
      - "${SERVER_PORT:-8080}:8080"

volumes:
  sa_learnership_pgdata:
  sa_learnership_uploads:

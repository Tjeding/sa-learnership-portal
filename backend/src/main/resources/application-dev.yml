spring:
  config:
    # Allow `mvn spring-boot:run` from backend/ to load local dev values.
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:sa_learnership}
    username: ${DB_USERNAME:sa_learnership_user}
    password: ${DB_PASSWORD:DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO
    com.tjeding.portal: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.security: DEBUG
    org.flywaydb: DEBUG

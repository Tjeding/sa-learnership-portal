spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: sa-learnership-portal
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # JPA/Hibernate: Flyway owns the schema, Hibernate should never auto-generate DDL.
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

# Custom app properties (bound via @ConfigurationProperties)
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:change-this-in-env-CHANGE-ME-min-32-chars-long}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}          # 24h access token
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}  # 7 days

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
